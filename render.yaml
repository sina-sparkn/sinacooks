services:
  # NestJS Backend API
  - type: web
    name: recipe-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: recipe-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: http://localhost:5173,https://*.vercel.app
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: STRAPI_URL
        fromService:
          type: web
          name: recipe-cms
          property: host
      - key: STRAPI_PUBLIC_URL
        fromService:
          type: web
          name: recipe-cms
          property: host
      - key: STRAPI_API_TOKEN
        sync: false

  # Strapi Headless CMS
  - type: web
    name: recipe-cms
    runtime: node
    plan: starter
    rootDir: cms
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: recipe-postgres
          property: connectionString
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

databases:
  - name: recipe-postgres
    plan: starter
    databaseName: app
    user: recipes
